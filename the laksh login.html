<!doctype html>
<html>
	<head>
		<title>
			Log In form
		</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,intial-scale=1.0">
		<link rel="stylesheet" href="the laksh login.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	</head>
	<body>
		<main>
			<div class="register">
				<div class="text">
					<h1>
						Login
					</h1>
				</div>
				<form class="form">
					<center>
						<div>
							<label for="phone"></label>
							<input type="tel" id="phone" name="phone" placeholder="Enter Contact Number" required class="input">
						</div>
						<div>
							<label for="pwd"></label>
							<input type="password" id="pwd" name="pwd" placeholder="Enter Password" required class="input">
						</div>
						<input type="submit" value="LOGIN" class="submit">
						<a href="the laksh me registretion form.html" class="Click-here-to-Register">
							<div class="font">
								Click here to Register.
							</div>
						</a>
					</center>
				</form>
			</div>
		</main>
	</body>
</html>
